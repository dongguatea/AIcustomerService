services:
  mysql:
    image: mysql:8.4
    container_name: mewhelp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mewhelp
      MYSQL_USER: mewhelp
      MYSQL_PASSWORD: mewhelp
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umewhelp", "-pmewhelp"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mewhelp_mysql_data:/var/lib/mysql

volumes:
  mewhelp_mysql_data:
