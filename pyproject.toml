[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.0.0",
    "openai>=2.0.0",
    "pydantic-settings>=2.16.1",
    "pymilvus>=3.0.0",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
